name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock          # tests never call the real API
      APP_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a secret was committed
        run: |
          if git grep -nE 'AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Possible API key committed to the repository"; exit 1
          fi
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env file committed"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest -q

      - name: Smoke test (app boots and serves /healthz)
        run: |
          gunicorn wsgi:app --bind 127.0.0.1:8000 --daemon
          sleep 3
          curl --fail --silent http://127.0.0.1:8000/healthz
